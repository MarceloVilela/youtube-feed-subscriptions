name: YouTube Feed

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch:
    inputs:
      feeds:
        description: "Feeds para scraping (subscriptions,home,channel)"
        required: false
        default: "subscriptions,home"

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      # Exposto no nível do job só para poder ser testado em `if:` (secrets não
      # são acessíveis diretamente em condicionais).
      GH_TOKEN: ${{ secrets.DEVFINDER_DISPATCH_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox
        run: npx playwright install firefox --with-deps

      - name: Run scraper
        env:
          HEADLESS: "true"
          # Google auth (usado no primeiro login via user-pass; cron usa stored)
          G_USER: ${{ secrets.YT_USER }}
          G_PASS: ${{ secrets.YT_PASS }}
          # USER é usado para nomear arquivos no storage local/imgur
          USER: ${{ secrets.YT_USER }}
          TIMEOUT_SHORT: 500
          TIMEOUT_LONG: 2500
          # Feeds: workflow_dispatch usa o input; cron usa o default
          FEEDS: ${{ inputs.feeds || 'subscriptions' }}
          ITERATION_NUM: 50
          # Storage
          STORE_IMG: imgur
          STORE_JSON: jsonbin
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          JSONBIN_API_KEY: ${{ secrets.JSONBIN_API_KEY }}
          JSONBIN_ID_STATE: ${{ secrets.JSONBIN_ID_STATE }}
          JSONBIN_ID_SUBS: ${{ secrets.JSONBIN_ID_SUBS }}
          JSONBIN_ID_HOME: ${{ secrets.JSONBIN_ID_HOME }}
          JSONBIN_ID_CHANNEL: ${{ secrets.JSONBIN_ID_CHANNEL }}
          # Necessário apenas se FEEDS incluir 'channel'
          CHANNEL_URL: ${{ secrets.CHANNEL_URL }}
        run: npm run task

      # Só roda se o scrape terminou com sucesso, ou seja, o JSON já foi gravado
      # no JSONbin, e se o secret existir. Usa PAT porque o GITHUB_TOKEN não
      # dispara workflows em outro repo.
      - name: Dispatch Video Refresh (devfinder-api)
        if: success() && env.GH_TOKEN != ''
        run: gh workflow run video-refresh.yml -R MarceloVilela/devfinder-api --ref master

